# =============================================================================
# CHBIndex: Airflow 3.3 stack (CeleryExecutor)
# =============================================================================
# Based on the official Airflow 3.3.0 docker-compose.yaml, with the CHBIndex
# image and the repository mounted at /opt/chbindex.
#
# First time (from the repository root):
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up airflow-init
#   docker compose -f docker/docker-compose.yml up -d
# UI: http://localhost:8080 (user and password: _AIRFLOW_WWW_USER_* in .env,
#     airflow / airflow if unset)
# Stop: docker compose -f docker/docker-compose.yml down
#
# Airflow 3 differences from Airflow 2: the UI and REST API run as
# api-server (was webserver), DAG files are parsed by a separate
# dag-processor, and workers reach the scheduler through the execution API.
# =============================================================================

x-airflow-common:
  &airflow-common
  # Built once, by airflow-init below; every Airflow service runs this image
  image: chbindex-airflow:3.3.0

  # Project secrets (ANTHROPIC_API_KEY, EPA_AQS_KEY, ALERT_EMAIL_TO,
  # AIRFLOW_CONN_SMTP_DEFAULT, ...). Never hardcoded here.
  env_file:
    - ../.env

  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # Keys from .env. FERNET encrypts connections and variables in the
    # metadata database; the JWT secret signs task and API tokens.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

    # Workers report task state to the API server (Airflow 3 task SDK)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # The repository is mounted at /opt/chbindex: DAGs and plugins are read
    # from it, and tasks import src.* and read config/ and data/ from it.
    AIRFLOW__CORE__DAGS_FOLDER: /opt/chbindex/airflow/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/chbindex/airflow/plugins
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Los_Angeles

  volumes:
    # The whole repository: code, config, the DuckDB warehouse, object store,
    # road network cache and ChromaDB store under data/
    - ..:/opt/chbindex
    - airflow-logs:/opt/airflow/logs
    # Google credentials from the host, read-only. Earth Engine uses the
    # token from `earthengine authenticate`; BigQuery and GCS use
    # `gcloud auth application-default login`. Missing folders mount empty.
    - ${HOME}/.config/earthengine:/home/airflow/.config/earthengine:ro
    - ${HOME}/.config/gcloud:/home/airflow/.config/gcloud:ro

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  # Airflow metadata: DAG runs, task states, connections
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Celery broker: the scheduler queues tasks, workers pick them up
  redis:
    image: redis:7.4
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # UI and REST API at localhost:8080 (replaces Airflow 2's webserver)
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Decides what runs when and queues it
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Parses DAG files (separate from the scheduler in Airflow 3)
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Runs the tasks
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"   # lets Celery shut down tasks cleanly
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Runs deferred tasks (sensors waiting on external events)
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off: migrates the metadata database and creates the UI user, then exits.
  # The image entrypoint does both when these _AIRFLOW_* variables are set.
  airflow-init:
    <<: *airflow-common
    # Only this service builds the image. With build: in the shared block,
    # compose built it once per service in parallel and the tags collided.
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    depends_on:
      <<: *airflow-common-depends-on

  # Celery monitoring at localhost:5555. Optional:
  #   docker compose -f docker/docker-compose.yml --profile flower up -d
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:      # Airflow metadata
  airflow-logs:     # task logs
