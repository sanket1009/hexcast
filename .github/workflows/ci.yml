# =============================================================================
# CHBIndex: Continuous Integration
# =============================================================================
# Runs on every push and on pull requests into main. Two jobs:
#
#   test  lint (ruff), format check, and pytest with a coverage floor.
#         Tests use synthetic data only: no API keys, network, or warehouse.
#   dags  imports every DAG file in Airflow 3.3 and checks the expected
#         DAGs exist (scripts/check_dags.py). Separate job because Airflow's
#         pins conflict with the spatial stack in requirements.txt.
#
# A red X on a commit means one of these failed; the job log says which.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only PyTorch first. sentence-transformers would otherwise pull the
      # CUDA build and about 2 GB of NVIDIA libraries the tests never use.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ tests/ airflow/dags/ scripts/ --output-format=github

      - name: Format check
        run: ruff format src/ tests/ airflow/dags/ scripts/ --check

      # The floor guards against coverage dropping; raise it as tests are added
      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=28
        env:
          # Placeholders: config_loader reads these, tests never call the APIs
          ANTHROPIC_API_KEY: "test-key-not-real"
          GCP_PROJECT_ID: "test-project"
          EPA_AQS_EMAIL: "test@example.com"
          EPA_AQS_KEY: "test"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  dags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Airflow with its own constraints file, as Airflow recommends. The DAG
      # files import only Airflow, PyYAML and pendulum at parse time.
      - name: Install Airflow 3.3.0
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.3.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.12.txt"

      - name: Check DAGs import
        run: python scripts/check_dags.py
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__DAGS_FOLDER: airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
