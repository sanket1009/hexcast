# =============================================================================
# CHBIndex: Continuous Deployment to Cloud Run
# =============================================================================
# Builds the API and dashboard images, pushes them to Artifact Registry and
# deploys two Cloud Run services:
#
#   chbindex-api        private: only the dashboard's service account may
#                       call it (Cloud Run IAM). Reads BigQuery.
#   chbindex-dashboard  public. Calls the API with a Google ID token.
#
# Auth is keyless (Workload Identity Federation): GitHub's OIDC token for this
# repo's main branch is exchanged for short-lived credentials of the deployer
# service account. No JSON key exists anywhere.
#
# One-time setup: scripts/gcp/setup_cloud_run.sh, then set the repository
# variables it prints (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA
# Until GCP_WIF_PROVIDER is set the job is skipped, so pushes stay green.
# =============================================================================

name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "src/serving/**"
      - "src/utils/**"
      - "dashboard/**"
      - "config/**"
      - "docker/Dockerfile.api"
      - "docker/Dockerfile.dashboard"
      - "docker/requirements-api.txt"
      - "docker/requirements-dashboard.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  # Never two deploys at once; a newer push waits for the running one
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/chbindex
  API_SA: chbindex-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  DASHBOARD_SA: chbindex-dashboard@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  deploy:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Images are tagged with the commit SHA, so any deploy can be rolled back
      # to a known commit (gcloud run services update-traffic --to-revisions)
      - name: Build and push images
        run: |
          for name in api dashboard; do
            docker build -f docker/Dockerfile.$name -t "$REGISTRY/$name:$GITHUB_SHA" .
            docker push "$REGISTRY/$name:$GITHUB_SHA"
          done

      # Private API: no --allow-unauthenticated. min-instances 0 means no
      # cost when idle (a cold start takes a few seconds); max-instances caps spend.
      - name: Deploy API
        run: |
          gcloud run deploy chbindex-api \
            --image "$REGISTRY/api:$GITHUB_SHA" \
            --region ${{ vars.GCP_REGION }} \
            --service-account "$API_SA" \
            --no-allow-unauthenticated \
            --port 8000 \
            --cpu 1 --memory 1Gi \
            --min-instances 0 --max-instances 2 \
            --set-env-vars CHBINDEX_BACKEND=gcp,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          # Idempotent: the dashboard may call the API
          gcloud run services add-iam-policy-binding chbindex-api \
            --region ${{ vars.GCP_REGION }} \
            --member "serviceAccount:$DASHBOARD_SA" \
            --role roles/run.invoker

      # Public dashboard. Session affinity keeps a browser's websocket on one
      # instance when Cloud Run runs two.
      - name: Deploy dashboard
        run: |
          API_URL=$(gcloud run services describe chbindex-api \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          gcloud run deploy chbindex-dashboard \
            --image "$REGISTRY/dashboard:$GITHUB_SHA" \
            --region ${{ vars.GCP_REGION }} \
            --service-account "$DASHBOARD_SA" \
            --allow-unauthenticated \
            --session-affinity \
            --cpu 1 --memory 1Gi \
            --min-instances 0 --max-instances 2 \
            --set-env-vars CHBINDEX_API_URL=$API_URL,CHBINDEX_API_AUDIENCE=$API_URL

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe chbindex-api \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          DASH_URL=$(gcloud run services describe chbindex-dashboard \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          # The API must refuse anonymous calls...
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/health")
          case "$code" in 401|403) ;; *) echo "API answered $code to an anonymous call"; exit 1 ;; esac
          # ...and the dashboard must be up
          curl -sf "$DASH_URL/_stcore/health"
          echo "Dashboard: $DASH_URL" >> "$GITHUB_STEP_SUMMARY"
