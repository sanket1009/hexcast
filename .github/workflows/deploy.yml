# =============================================================================
# CHBIndex — Continuous Deployment
# =============================================================================
# Runs ONLY when code is pushed to main branch.
# Purpose: automatically deploy the FastAPI container to GCP Cloud Run.
#
# What it does:
#   1. Builds the FastAPI Docker image
#   2. Pushes it to Google Artifact Registry
#   3. Deploys it to GCP Cloud Run
#
# Prerequisites (set these in GitHub repo Settings → Secrets):
#   GCP_PROJECT_ID          — your GCP project ID
#   GCP_SERVICE_ACCOUNT_KEY — base64-encoded service account JSON key
#   GCP_REGION              — deployment region (e.g. us-central1)
# =============================================================================

name: Deploy to Cloud Run

# Trigger: only on pushes to main
# This means: only deploy reviewed, approved, merged code
# Never deploy directly from feature branches
#
# Currently manual only (Actions tab -> Run workflow). Restore the push
# trigger below once src/serving/api.py exists and the GCP secrets
# (GCP_PROJECT_ID, GCP_SERVICE_ACCOUNT_KEY, GCP_REGION) are set.
#   push:
#     branches: ["main"]
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required permissions for Google Cloud authentication
    permissions:
      contents: read
      id-token: write     # needed for Workload Identity Federation

    steps:
      # Step 1 — Check out code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Authenticate to Google Cloud
      # Uses the service account key stored in GitHub Secrets
      # Never hardcode credentials — always use secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # Step 3 — Set up Google Cloud SDK
      # Gives us the gcloud CLI tool for subsequent steps
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 4 — Configure Docker to use Google Artifact Registry
      # Allows docker push to push images to GCP's container registry
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Step 5 — Build the FastAPI Docker image
      # Tags the image with the git commit SHA for traceability
      # You can always roll back to a specific commit's image
      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chbindex/api:${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chbindex/api:latest \
            .

      # Step 6 — Push image to Google Artifact Registry
      # Both the commit-SHA tag and 'latest' tag get pushed
      # 'latest' is what Cloud Run deploys by default
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chbindex/api:${{ github.sha }}
          docker push \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chbindex/api:latest

      # Step 7 — Deploy to Cloud Run
      # Cloud Run pulls the latest image and starts serving it
      # --region: where to deploy
      # --platform managed: fully managed Cloud Run (no Kubernetes needed)
      # --allow-unauthenticated: public API — no auth token required to call it
      # --memory 1Gi: 1GB RAM per instance (enough for BigQuery queries)
      # --max-instances 3: scale up to 3 instances under load
      #                    free tier gives 2M requests/month
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chbindex-api \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chbindex/api:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --max-instances 3 \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}

      # Step 8 — Print the deployed URL
      # This URL is your live FastAPI endpoint
      # Add it to your resume and GitHub README
      - name: Get deployed URL
        run: |
          gcloud run services describe chbindex-api \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)'