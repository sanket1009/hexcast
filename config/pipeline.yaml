# =============================================================================
# CHBIndex — Global Pipeline Configuration
# =============================================================================
# This file contains settings that apply to ALL cities equally.
# It is merged with the city-specific config at runtime by config_loader.py.
# Rule: if a value changes per city → it belongs in cities/{city}.yaml
#       if a value is the same for every city → it belongs here
# =============================================================================

airflow:
  max_retries: 3
  retry_delay_minutes: 5
  task_timeout_minutes: 60
  # Weeks between a run date and the week it processes. EPA AQS data
  # arrives months late; a run on Nov 9, 2026 processes the week of June 22.
  ingest_lag_weeks: 20
  email_on_failure: false
  email_on_retry: false

rate_limits:
  epa_aqs_request_delay_seconds: 1.5
  cdc_places_request_delay_seconds: 1.0
  gee_poll_interval_seconds: 30
  gee_export_timeout_minutes: 45

storage:
  # "local" = DuckDB file + local folder (development, no cloud account)
  # "gcp"   = BigQuery + Cloud Storage (production)
  backend: "local"
  local_db_path: "data/warehouse/chbindex.duckdb"
  local_object_dir: "data/object_store"

bigquery:
  write_batch_size: 5000
  write_disposition: "WRITE_APPEND"
  job_timeout_seconds: 300
  partition_field: "week_start_date"

spatial:
  kriging_variogram_model: "spherical"
  kriging_n_jobs: -1
  kriging_min_pairs_per_bin: 30   # equal-count variogram bins, at least this many monitor pairs each
  h3_resolution: 7
  h3_lag_rings: 2
  lst_zonal_stats:
    - "mean"
    - "std"
    - "max"
  lst_min_pixel_count: 10

ml:
  random_seed: 42
  cv_folds: 5
  training_weeks: 52
  temporal_lag_weeks:
    - 1
    - 2
    - 4
  shap_background_samples: 100
  mlflow_tracking_uri: "mlflow/mlruns"
  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
  ab_test_significance_threshold: 0.05

rag:
  # A1 gold set (evals/datasets/retrieval_gold_v1.json, 2026-11-11): Qwen3-Embedding-0.6B
  # (Apache 2.0) vs all-MiniLM-L6-v2. Qwen3 at 0.45: recall@3 0.334, MRR 0.581,
  # negative rejection 1.0. MiniLM at 0.50: 0.259, 0.478, 0.714, and no MiniLM
  # cutoff rejected every negative with recall@3 above 0.19.
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"
  # Query/document encoding per model (vectorstore.encode_kwargs): <role> = a
  # prompt stored with the model, <role>_text = literal prompt. Unlisted models
  # encode plain text. Qwen3-Embedding embeds documents plain and prefixes queries
  # with a task instruction. A1 (2026-11-11), instruction vs the model's generic
  # "query" prompt: recall@3 ceiling 0.345 -> 0.399, MRR 0.633 -> 0.723, and
  # negatives pushed further out (closest 0.461 -> 0.503).
  embedding_prompts:
    "Qwen/Qwen3-Embedding-0.6B":
      query_text: "Instruct: Given a question about protecting a group of residents, retrieve policy passages that recommend specific actions, programs, or services for that group\nQuery:"
  chroma_persist_path: "chromadb/chroma_store"
  chroma_collection_name: "chbindex_policy_docs"
  top_k_chunks: 3
  # From the A1 sweep (2026-11-11, Qwen3 + task instruction, steps of 0.02): 0.48
  # is the lowest cutoff with no empty real query and all 7 negatives rejected
  # (recall@3 0.385, MRR 0.698), 0.023 below the closest negative (0.503). An
  # empty slot gets the "No guidance" line; a leaked page becomes a wrong
  # excerpt, so we stay clear of the edge. Model- and instruction-specific:
  # re-sweep (scripts/eval_retrieval.py) after changing either.
  max_distance: 0.48
  chunk_size: 800
  chunk_overlap: 150
  chroma_dir: data/chroma
  min_chunk_chars: 100
  collection_prefix: policy_docs
  upsert_batch_size: 500
  # Briefing (briefing.py)
  anthropic:
    model: "claude-haiku-5-5"
    max_tokens: 3000          # headroom for adaptive thinking plus the JSON
  urgency_levels:
    - "MONITOR"
    - "ELEVATED"
    - "CRITICAL"
  # urgency comes from burden_class (see burden_percentiles in the city config)
  briefing_excerpts_per_driver: 3
  default_vulnerable_group: "vulnerable residents"
  driver_queries:
    heat: "actions to protect {group} from extreme heat, such as cooling centers and safer indoor temperatures"
    # Driver is the annual mean PM2.5 (long-term exposure), so the query targets
    # traffic and near-road exposure. Smoke guidance waits for a real-time smoke
    # driver (AirNow); with it in this query, CDPH smoke pages took every slot.
    air_quality: "actions to reduce {group}'s long-term exposure to fine particle pollution near busy roads and freeways, such as high-efficiency indoor air filtration and roadside vegetation barriers"
    # Heat wording removed (Nov 11, 2026): "heat-illness protocols" sent every
    # access query to the heat plan's clinician-training page, so the access
    # plan was heat actions.
    healthcare_access: "actions for health services to reach {group} with limited access to hospitals, such as mobile clinics, street medicine outreach, telehealth, and transportation to medical care"
  # Group pieces (action_plans.py) use these when set, else driver_queries.
  # A fixed example tail ("such as ...") outweighs a 3-4 word group label, so
  # every group of a driver retrieved the same pages (Qwen3, 2026-11-11: heat 6
  # of 7 groups identical, air quality 7 of 7). Group-led wording with no tail
  # lets the group decide; build_corpus.py --groups reports distinct pages per
  # driver (group diversity) to check it.
  group_queries:
    heat: "keeping {group} safe during extreme heat"
    air_quality: "protecting {group} from fine particle air pollution"
    healthcare_access: "helping {group} get to medical care"

logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  log_to_file: false
  log_file_path: "logs/chbindex.log"

