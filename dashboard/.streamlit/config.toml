# Hexcast dashboard theme (2026-11-18 refresh, Apple-style).
# San Francisco on Apple devices through the system font stack, Inter elsewhere.
# Neutral greys and one blue for controls; the map's OrRd ramp stays the only
# warm color, so the data still carries the color. Light and dark are both
# defined, so the viewer keeps Streamlit's appearance toggle. The few things
# config cannot set (heading tracking, filled KPI tiles, rounded map) are in
# dashboard/ui/style.py.

[theme]
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "ui-monospace, 'SF Mono', Menlo, monospace"
baseFontSize = 15
headingFontSizes = ["2.75rem", "1.75rem", "1.25rem", "1.0625rem", "0.9375rem", "0.8125rem"]
headingFontWeights = [700, 700, 600, 600, 600, 500]
metricValueFontSize = "1.625rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = false
showSidebarBorder = false
linkUnderline = false
paddingTop = "2rem"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F7"
textColor = "#1D1D1F"
grayTextColor = "#6E6E73"
borderColor = "#E5E5EA"
dataframeBorderColor = "#E5E5EA"
primaryColor = "#0071E3"
linkColor = "#0066CC"
codeTextColor = "#1D1D1F"
dataframeHeaderBackgroundColor = "#F5F5F7"
dataframeHeaderTextColor = "#6E6E73"
chartCategoricalColors = ["#1D1D1F", "#B30000", "#0071E3", "#E08214", "#6E6E73", "#8C510A", "#4D4D4D", "#F4A582"]

[theme.light.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#E8E8ED"

[theme.dark]
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
grayTextColor = "#98989D"
borderColor = "#38383A"
dataframeBorderColor = "#38383A"
primaryColor = "#0A84FF"
linkColor = "#2997FF"
codeTextColor = "#F5F5F7"
dataframeHeaderBackgroundColor = "#1C1C1E"
dataframeHeaderTextColor = "#98989D"
chartCategoricalColors = ["#F5F5F7", "#FC8D59", "#64D2FF", "#FDB863", "#98989D", "#DFC27D", "#BDBDBD", "#F4A582"]

[theme.dark.sidebar]
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#2C2C2E"

[client]
# "viewer": the menu shows Settings (light/dark theme) but no developer options
toolbarMode = "viewer"
