# Hexcast dashboard theme (Phase 7 spec, approved 2026-11-12).
# Editorial / public-health publication look: the interface is monochrome and
# the data is the only color. Light and dark are both defined, so the viewer
# keeps Streamlit's appearance toggle. No CSS: everything here is config.

[theme]
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontSizes = ["2.25rem", "1.625rem", "1.25rem", "1rem", "0.875rem", "0.75rem"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600
baseRadius = "4px"
buttonRadius = "4px"
linkUnderline = true
paddingTop = "2.5rem"

[theme.light]
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F0F0EB"
textColor = "#1A1A1A"
grayTextColor = "#5C5C58"
borderColor = "#D4D4CF"
primaryColor = "#1A1A1A"
linkColor = "#1A1A1A"
codeTextColor = "#1A1A1A"
dataframeHeaderBackgroundColor = "#F0F0EB"
# Overlaid trend lines for several tracts: no teal, cyan or violet
chartCategoricalColors = ["#1A1A1A", "#B30000", "#2166AC", "#E08214", "#5C5C58", "#8C510A", "#4D4D4D", "#F4A582"]

[theme.dark]
backgroundColor = "#161616"
secondaryBackgroundColor = "#202020"
textColor = "#ECECE8"
grayTextColor = "#A3A3A0"
borderColor = "#3A3A3A"
# Streamlit uses primary both behind white text (selected chips, primary
# buttons) and as the text of selected pills and segments. #7A7A76 reads at
# about 4.4:1 in both roles; the off-white text color fails the first.
primaryColor = "#7A7A76"
linkColor = "#ECECE8"
codeTextColor = "#ECECE8"
dataframeHeaderBackgroundColor = "#202020"
chartCategoricalColors = ["#ECECE8", "#FC8D59", "#92C5DE", "#FDB863", "#A3A3A0", "#DFC27D", "#BDBDBD", "#F4A582"]

[client]
toolbarMode = "minimal"
